    .container { max-width: 780px; margin: 0 auto; padding: 24px 16px; }

    /* Menú Principal de Módulos */
    .grid-modulos { display: grid; gap: 16px; }
    .modulo-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;

    .modulo-desc { font-size: 0.85rem; color: var(--muted); }

    /* Vistas de Módulo */
    .hidden { display: none; }
    .btn-back {
      background: transparent;
      border: 1px solid var(--border);

      margin-bottom: 20px;
      font-size: 0.9rem;

      transition: all 0.2s;

    .teoria-box {
      background: var(--card);
      border-radius: 14px;
      padding: 24px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .teoria-box h3 { font-size: 1rem; margin: 16px 0 8px; color: #e2e8f0; }
    .paso-item {
      background: rgba(15, 23, 42, 0.7);

      border-radius: 8px;

      font-size: 0.9rem;
    }

    /* Reproductor de Audio */
    .audio-profe {
      background: linear-gradient(135deg, #151c2c 0%, #0b0f19 100%);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 18px;
      margin: 18px 0;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.1);
    }
    .audio-icon {
      background: var(--accent);
      color: #0b0f19;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .audio-info h4 { font-size: 0.92rem; color: var(--accent); margin-bottom: 3px; font-weight: 700; }
    .audio-info p { font-size: 0.82rem; color: var(--muted); margin-bottom: 8px; }
    audio { width: 100%; height: 34px; filter: invert(90%) hue-rotate(180deg); }

    /* Tarjetas de Ejercicios y Zonas Interactivas */
    .ejercicio-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;

    }
    .enunciado {
      font-size: 0.98rem;

    }
    .solucion-box {
      margin-top: 14px;
      padding: 14px;
      background: rgba(56, 189, 248, 0.08);
      border-radius: 10px;
      border: 1px dashed var(--primary);
      font-size: 0.9rem;
    }
    
    /* Autocorrector interactivo */
    .interactive-box {
      margin-top: 14px;
      padding: 16px;
      background: #0b0f19;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .interactive-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      width: 130px;
      text-align: center;
      margin-right: 10px;
    }
    .interactive-input.error { border-color: var(--error); background: rgba(239, 68, 68, 0.1); }
    .interactive-input.success { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
    .feedback-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Caja de Bloqueo por Límite de Preguntas Gratuitas */
    .paywall-box {
      background: linear-gradient(135deg, #1e293b 0%, #0b0f19 100%);

      margin-top: 18px;
      box-shadow: 0 10px 25px -5px rgba(0, 158, 227, 0.2);
    }
    .paywall-box h3 { color: var(--mercadopago); font-size: 1.25rem; margin-bottom: 10px; font-weight: 800; }
    .paywall-box p { font-size: 0.92rem; color: var(--muted); margin-bottom: 18px; }

    /* Selector de Clases (+ y -) */
    .counter-container {

    }
    .counter-btn {
      background: var(--card-hover);
      color: var(--text);
      border: 1px solid var(--border);

      height: 44px;
      border-radius: 50%;
      font-weight: bold;
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .counter-btn:hover { background: var(--primary); color: #0b0f19; transform: scale(1.05); }
    .counter-value { font-size: 1.3rem; font-weight: 800; min-width: 35px; text-align: center; color: var(--primary); }

<header>
  <h1>Matemática 1° EMS (4° Liceo) - Uruguay</h1>
  <p>Plataforma de Preparación de Exámenes y Apoyo Docente</p>
</header>

<div class="container">

  <!-- MENÚ PRINCIPAL -->
  <section id="menu-principal">
    <p style="color: var(--muted); margin-bottom: 20px; font-size: 0.9rem;">
      Seleccioná un bloque temático oficial del programa para estudiar la teoría, escuchar los audios del profesor y practicar con preguntas interactivas.

          <div class="modulo-title">1. Interpretación Gráfica y Estudio de Funciones</div>
          <div class="modulo-desc">Dominio, recorrido, raíces, signo, crecimiento y asíntotas.</div>
        </div>
        <span style="color: var(--primary); font-weight: bold; font-size: 1.2rem;">➔</span>
      </div>

      <div class="modulo-card" onclick="cargarModulo('m2')">
        <div>
          <div class="modulo-tag">Bloque 2 • Ecuaciones e Inecuaciones</div>
          <div class="modulo-title">2. Resolución Gráfica y Conjuntos Solución</div>
          <div class="modulo-desc">Lectura de intersecciones, inecuaciones racionales y notación.</div>
        </div>
        <span style="color: var(--primary); font-weight: bold; font-size: 1.2rem;">➔</span>
      </div>

      <div class="modulo-card" onclick="cargarModulo('m3')">
        <div>
          <div class="modulo-tag">Bloque 3 • Exponenciales y Logaritmos</div>
          <div class="modulo-title">3. Funciones Exponenciales y Logarítmicas</div>
          <div class="modulo-desc">Propiedades, condiciones de existencia e inversa.</div>
        </div>
        <span style="color: var(--primary); font-weight: bold; font-size: 1.2rem;">➔</span>
      </div>

      <div class="modulo-card" onclick="cargarModulo('m4')">
        <div>
          <div class="modulo-tag">Bloque 4 • Sistemas Lineales</div>
          <div class="modulo-title">4. Sistemas de Ecuaciones Lineales 3×3</div>
          <div class="modulo-desc">Método de Gauss, clasificación e interpretación geométrica.</div>
        </div>
        <span style="color: var(--primary); font-weight: bold; font-size: 1.2rem;">➔</span>
      </div>

      <div class="modulo-card" onclick="cargarModulo('m5')">
        <div>
          <div class="modulo-tag">Bloque 5 • Geometría y Trigonometría</div>
          <div class="modulo-title">5. Ángulos, Teoremas y Lugares Geométricos</div>

        </div>
        <span style="color: var(--primary); font-weight: bold; font-size: 1.2rem;">➔</span>
      </div>
    </div>
  </section>

  <!-- VISTA INTERNA DINÁMICA DE MÓDULOS -->
  <section id="vista-modulo" class="hidden">
    <button class="btn-back" onclick="volverMenu()">← Volver al Selector de Módulos</button>
    <div id="contenido-modulo-dinamico"></div>

    <script>
  const TELEFONO_PROFE = "59896643887"; // 096 643 887

  // Enlaces de Mercado Pago exactos por cantidad de clases (del 1 al 10)
  const LINKS_MERCADOPAGO = {
    1: "https://mpago.la/1ic1ZyD",  // 1 clase ($300)
    2: "https://mpago.la/2GD6kdf",  // 2 clases ($600)
    3: "https://mpago.la/1Mgx8ZB",  // 3 clases ($900)
    4: "https://mpago.la/28dq2T1",  // 4 clases ($1.200)
    5: "https://mpago.la/1XRpZYf",  // 5 clases ($1.500)
    6: "https://mpago.la/2oATVxh",  // 6 clases ($1.800)
    7: "https://mpago.la/2SKKq9C",  // 7 clases ($2.100)
    8: "https://mpago.la/1aBsmJi",  // 8 clases ($2.400)
    9: "https://mpago.la/1XCz4CK",  // 9 clases ($2.700)
    10: "https://mpago.la/1rkGKuT" // 10 clases ($3.000)
  };

  // Control de preguntas gratuitas (máximo 3)
  let preguntasRespondidas = parseInt(localStorage.getItem("preguntasRespondidas") || "0");

  const datosModulos = {
    m1: {
      titulo: "Bloque 1: Interpretación Gráfica de Funciones Reales",
      teoria: `
        <h2>1. Objetivos y Metodología Oficial</h2>
        <p>Según el programa de EMS, el foco principal está en leer, extraer y justificar información directamente de las representaciones gráficas antes de pasar al análisis algebraico formal.</p>
        <div class="paso-item"><strong>Dominio e Imagen:</strong> Lectura directa sobre los ejes X e Y de los valores reales válidos para la función.</div>
        <div class="paso-item"><strong>Raíces y Ordenada:</strong> Puntos de corte con el eje horizontal ($f(x)=0$) y con el eje vertical ($f(0)$).</div>
      `,
      audio: {
        titulo: "Audio del Profesor: Explicación de la Función Exponencial",
        desc: "Escuchá esta explicación para comprender el comportamiento gráfico y analítico.",
        src: "https://raw.githubusercontent.com/carlotajoyaspaysandu-alt/Matem-tica-pro/bf611df5b07b47e153ceaf010c0924b0d9a7d51e/Funci_n_Exponencial%20(1).mp3"
      },
      ejercicios: [
        {
          tipo: "interactivo",
          enunciado: "Pregunta 1: Hallar la <strong>raíz</strong> de la función $$f(x) = \\frac{2x - 4}{x + 1}$$",
          respuestaCorrecta: "2"
        },
        {
          tipo: "interactivo",
          enunciado: "Pregunta 2: Hallar la <strong>ordenada en el origen</strong> de $$f(x) = \\frac{2x - 4}{x + 1}$$",
          respuestaCorrecta: "-4"
        },
        {
          tipo: "interactivo",
          enunciado: "Pregunta 3: Hallar el valor de la <strong>asíntota horizontal</strong> de $$f(x) = \\frac{2x - 4}{x + 1}$$",
          respuestaCorrecta: "2"
        },
        {
          tipo: "interactivo",
          enunciado: "Pregunta 4 (Evaluación Avanzada): Hallar la abscisa del punto donde la función corta al eje horizontal en $$g(x) = 3x - 6$$",
          respuestaCorrecta: "2"
        }
      ]
    },
    m2: {
      titulo: "Bloque 2: Resolución de Ecuaciones e Inecuaciones Gráficas",
      teoria: `<h2>2. Enfoque del Programa Oficial</h2>`,
      ejercicios: [
        {
          tipo: "interactivo",
          enunciado: "Pregunta de Práctica: Indicar el valor de la raíz del numerador en $f(x) = \\frac{x - 3}{x + 2}$",
          respuestaCorrecta: "3"
        }
      ]
    },
    m3: {
      titulo: "Bloque 3: Funciones Exponenciales y Logarítmicas",
      teoria: `<h2>3. Definiciones y Relación Inversa</h2>`,
      ejercicios: [
        {
          tipo: "interactivo",
          enunciado: "Pregunta de Práctica: Resolver $2^x = 8$. ¿Cuánto vale $x$?",
          respuestaCorrecta: "3"
        }
      ]
    },
    m4: {
      titulo: "Bloque 4: Sistemas de Ecuaciones Lineales 3×3",
      teoria: `<h2>4. Enfoque Algebraico y Geométrico</h2>`,
      ejercicios: [
        {
          tipo: "guiado",
          enunciado: "Ejemplo Resuelto: Sistema lineal 3x3",
          solucion: "Solución terna: x = 1, y = 2, z = 3."
        }
      ]
    },
    m5: {
      titulo: "Bloque 5: Geometría y Trigonometría",
      teoria: `<h2>5. Geometría Avanzada</h2>`,
      ejercicios: [
        {
          tipo: "guiado",
          enunciado: "Ejemplo Resuelto: Mediatriz",
          solucion: "Ecuación: y = -x + 7."
        }
      ]
    }
  };

  function cargarModulo(id) {
    const mod = datosModulos[id];
    document.getElementById("menu-principal").classList.add("hidden");
    document.getElementById("vista-modulo").classList.remove("hidden");

    let html = `
      <div class="teoria-box">
        <h2>${mod.titulo}</h2>
        ${mod.teoria}
      </div>
    `;

    if (mod.audio) {
      html += `
        <div class="audio-profe">
          <div class="audio-icon">🎧</div>
          <div class="audio-info" style="width: 100%;">
            <h4>${mod.audio.titulo}</h4>
            <p>${mod.audio.desc}</p>
            <audio controls>
              <source src="${mod.audio.src}" type="audio/mpeg">
              Tu navegador no soporta el elemento de audio.
            </audio>
          </div>
        </div>
      `;
    }

    html += `<div style="font-size: 1.1rem; color: var(--primary); margin: 24px 0 12px; font-weight: 700;">Práctica Interactiva y Exámenes</div>`;

    mod.ejercicios.forEach((ej, index) => {
      const idEj = `ej_${id}_${index}`;
      
      html += `
        <div class="ejercicio-card">
          <span class="modulo-tag">${ej.tipo === 'interactivo' ? 'Pregunta Práctica' : 'Ejemplo Resuelto'}</span>
          <div class="enunciado">${ej.enunciado}</div>
      `;

      if (ej.tipo === 'interactivo') {
        if (preguntasRespondidas >= 3) {
          html += `
            <div class="paywall-box">
              <h3>🔒 ¡Alcanzaste el límite de 3 preguntas gratis!</h3>
              <p>Para seguir practicando con exámenes reales y asegurar tu nota, contratá clases personalizadas con el profesor.</p>
              
              <div style="font-weight: 700; font-size: 0.95rem; margin-top: 10px; color: #fff;">¿Cuántas clases querés? ($300 c/u)</div>
              <div class="counter-container">
                <button class="counter-btn" onclick="cambiarCantidad(-1)">-</button>
                <span id="cant-clases" class="counter-value">1</span>
                <button class="counter-btn" onclick="cambiarCantidad(1)">+</button>
              </div>
              <div style="font-size: 0.9rem; color: var(--muted); margin-bottom: 16px;">Total a pagar: $<span id="total-precio" style="color: var(--accent); font-weight: 800;">300</span> UYU</div>

              <a id="btn-pagar-mp" class="btn-mercadopago" href="${LINKS_MERCADOPAGO[1]}" target="_blank">
                💳 Pagar Clases con Mercado Pago
              </a>

              <a id="btn-wsp-coord" class="btn-whatsapp" href="https://wa.me/${TELEFONO_PROFE}?text=${encodeURIComponent('Hola Profe! Ya realicé el pago de 1 clase(s) por Mercado Pago y quiero coordinar día y hora.')}" target="_blank">
                💬 Ya pagué, coordinar por WhatsApp
              </a>
            </div>
          `;
        } else {
          html += `
            <div class="contador-gratis">Pregunta gratuita N.º ${preguntasRespondidas + 1} de 3</div>
            <div class="interactive-box">
              <label style="font-size: 0.9rem; display:block; margin-bottom:6px; color: var(--text);">Tu respuesta numérica:</label>
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:10px;">
                <input type="text" id="input_${idEj}" class="interactive-input" placeholder="Ej. 2 o -4">
                <button class="btn btn-primary" onclick="verificarRespuesta('${idEj}', '${ej.respuestaCorrecta}')">Comprobar</button>
              </div>
              <div id="feedback_${idEj}" class="feedback-msg"></div>
            </div>
          `;
        }
      } else {
        html += `
          <div style="margin-top: 12px;">
            <button class="btn btn-primary" onclick="toggleSol('${idEj}')">👁️ Ver Solución Paso a Paso</button>
          </div>
          <div id="${idEj}" class="solucion-box hidden">${ej.solucion}</div>
        `;
      }

      html += `</div>`;
    });

    document.getElementById("contenido-modulo-dinamico").innerHTML = html;
    if (window.renderMathInElement) renderMathInElement(document.body);
    window.scrollTo(0, 0);
  }

  function verificarRespuesta(idEj, correcta) {
    const input = document.getElementById(`input_${idEj}`);
    const feedback = document.getElementById(`feedback_${idEj}`);
    const valorUsuario = input.value.trim();

    if (valorUsuario === "") {
      input.className = "interactive-input error";
      feedback.className = "feedback-msg error";
      feedback.style.color = "var(--error)";
      feedback.innerHTML = "⚠️ Por favor ingresá un valor.";
      return;
    }

    if (valorUsuario === correcta) {
      input.className = "interactive-input success";
      feedback.className = "feedback-msg success";
      feedback.style.color = "var(--success)";
      feedback.innerHTML = "✅ ¡Correcto!";
    } else {
      input.className = "interactive-input error";
      feedback.className = "feedback-msg error";
      feedback.style.color = "var(--error)";
      feedback.innerHTML = "❌ Incorrecto.";
    }

    preguntasRespondidas++;
    localStorage.setItem("preguntasRespondidas", preguntasRespondidas);

    if (preguntasRespondidas >= 3) {
      setTimeout(() => {
        alert("¡Has completado tus 3 preguntas gratuitas! A continuación se abrirán las opciones de clases personalizadas.");
        location.reload();
      }, 1200);
    }
  }

  let cantidadClases = 1;
  const VALOR_CLASE = 300;

  function cambiarCantidad(cambio) {
    cantidadClases += cambio;
    if (cantidadClases < 1) cantidadClases = 1;
    if (cantidadClases > 10) cantidadClases = 10;

    const elemCant = document.getElementById("cant-clases");
    const elemPrecio = document.getElementById("total-precio");
    const btnMp = document.getElementById("btn-pagar-mp");
    const btnWsp = document.getElementById("btn-wsp-coord");

    if (elemCant) elemCant.innerText = cantidadClases;
    if (elemPrecio) elemPrecio.innerText = cantidadClases * VALOR_CLASE;

    // Actualiza automáticamente el enlace de Mercado Pago según las clases elegidas
    if (btnMp) {
      btnMp.href = LINKS_MERCADOPAGO[cantidadClases];
    }

    // Actualiza el mensaje prearmado de WhatsApp con la cantidad exacta de clases
    if (btnWsp) {
      btnWsp.href = `https://wa.me/${TELEFONO_PROFE}?text=` + encodeURIComponent(`Hola Profe! Ya realicé el pago de ${cantidadClases} clase(s) por Mercado Pago y quiero coordinar día y hora.`);
    }
  }

  function volverMenu() {
    document.getElementById("vista-modulo").classList.add("hidden");
    document.getElementById("menu-principal").classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  function toggleSol(id) {
    document.getElementById(id).classList.toggle("hidden");
  }
</script>
